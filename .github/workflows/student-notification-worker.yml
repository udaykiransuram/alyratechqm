name: Student Notification Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-notification-worker
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate worker secrets
        env:
          WORKER_SECRET: ${{ secrets.STUDENT_NOTIFICATION_WORKER_SECRET }}
          WORKER_URL: ${{ secrets.STUDENT_NOTIFICATION_WORKER_URL }}
        run: |
          if [ -z "${WORKER_URL}" ] || [ -z "${WORKER_SECRET}" ]; then
            echo "Skipping worker run because STUDENT_NOTIFICATION_WORKER_URL or STUDENT_NOTIFICATION_WORKER_SECRET is missing."
            exit 0
          fi

      - name: Trigger student notification worker
        env:
          WORKER_SECRET: ${{ secrets.STUDENT_NOTIFICATION_WORKER_SECRET }}
          WORKER_URL: ${{ secrets.STUDENT_NOTIFICATION_WORKER_URL }}
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          http_status="$(
            curl -sS \
              -o "${response_file}" \
              -w "%{http_code}" \
              -X POST "${WORKER_URL}" \
              -H "content-type: application/json" \
              -H "x-student-notification-worker-secret: ${WORKER_SECRET}" \
              --data '{}'
          )"

          cat "${response_file}"

          if [ "${http_status}" -lt 200 ] || [ "${http_status}" -ge 300 ]; then
            echo
            echo "Student notification worker failed with HTTP ${http_status}."
            exit 1
          fi
